name: CI Integration and Evaluation

on:
  push:
    branches: ["main", "phase-*"]
  pull_request:
    branches: ["main", "phase-*"]

jobs:
  backend-quality:
    name: Backend quality and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q app tests

      - name: Ruff
        run: ruff check app tests

      - name: Unit and regression tests
        run: pytest -q tests --ignore=tests/test_phase1_foundation.py

      - name: Deterministic evaluation gate
        run: python evals/ci_gate.py

  integration:
    name: PostgreSQL and Redis integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: enterprise_doc
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d enterprise_doc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify database and Redis connectivity
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/enterprise_doc
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: ci-test-secret
        run: python -c "import os, psycopg, redis; psycopg.connect(os.environ['DATABASE_URL']).close(); assert redis.from_url(os.environ['REDIS_URL']).ping(); print('PostgreSQL and Redis OK')"

      - name: Run database migrations
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/enterprise_doc
          SECRET_KEY: ci-test-secret
        run: alembic upgrade head

      - name: Verify migrated schema
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/enterprise_doc
          SECRET_KEY: ci-test-secret
        run: python -c "from app.db.session import engine; from sqlalchemy import inspect; names=inspect(engine).get_table_names(); print(names); assert names, 'No database tables were created'"
