name: CI

on:
  push:
    branches: [main, 'phase-*', 'fix/*']
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m compileall app
      - run: ruff check app tests
      - run: PYTHONPATH=. pytest -q --ignore=tests/test_phase1_foundation.py
      - name: Deterministic evaluation gate
        working-directory: .
        run: PYTHONPATH=backend python evals/ci_gate.py
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
