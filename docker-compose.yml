version: '3.8'
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: enterprise
      POSTGRES_USER: enterprise
      POSTGRES_PASSWORD: enterprise
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]

  mongo:
    image: mongo:8.0
    ports: ["27017:27017"]
    volumes: ["mongo_data:/data/db"]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  backend:
    build: ./backend
    ports: ["8000:8000"]
    volumes: ["./backend:/app"]
    env_file: ["./backend/.env"]
    environment:
      DATABASE_URL: postgresql+psycopg://enterprise:enterprise@postgres:5432/enterprise
      REDIS_URL: redis://redis:6379/0
      MONGODB_URL: mongodb://mongo:27017/?retryWrites=false
      MONGODB_DATABASE: enterprise_intelligence
    depends_on: [postgres, mongo, redis]
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build: ./backend
    volumes: ["./backend:/app"]
    env_file: ["./backend/.env"]
    environment:
      DATABASE_URL: postgresql+psycopg://enterprise:enterprise@postgres:5432/enterprise
      REDIS_URL: redis://redis:6379/0
      MONGODB_URL: mongodb://mongo:27017/?retryWrites=false
      MONGODB_DATABASE: enterprise_intelligence
    depends_on: [postgres, mongo, redis]
    command: celery -A app.workers.celery_app.celery_app worker --loglevel=INFO

  frontend:
    build: ./frontend
    ports: ["3000:3000"]
    volumes: ["./frontend:/app", "/app/node_modules"]
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    command: npm run dev

volumes:
  postgres_data:
  mongo_data:
