version: '3.8'
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: enterprise
      POSTGRES_USER: enterprise
      POSTGRES_PASSWORD: enterprise
    ports: ["5433:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]

  redis:
    image: redis:7-alpine
    # Windows already has a Redis instance on 6379; expose Docker Redis on a
    # dedicated host port so the Windows API and Docker worker use one broker.
    ports: ["6380:6379"]

  backend:
    build: ./backend
    ports: ["8000:8000"]
    volumes:
      - "./backend:/app"
      - "./uploads:/shared/uploads"
      - "./chroma_db:/shared/chroma_db"
    env_file: ["./backend/.env"]
    environment:
      DATABASE_URL: postgresql+psycopg://enterprise:enterprise@postgres:5432/enterprise
      REDIS_URL: redis://redis:6379/0
      UPLOAD_DIR: /shared/uploads
      CHROMA_DB_DIR: /shared/chroma_db
    depends_on: [postgres, redis]
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build: ./backend
    volumes:
      - "./backend:/app"
      - "./uploads:/shared/uploads"
      - "./chroma_db:/shared/chroma_db"
    env_file: ["./backend/.env"]
    environment:
      DATABASE_URL: postgresql+psycopg://enterprise:enterprise@postgres:5432/enterprise
      REDIS_URL: redis://redis:6379/0
      UPLOAD_DIR: /shared/uploads
      CHROMA_DB_DIR: /shared/chroma_db
    depends_on: [postgres, redis]
    command: celery -A app.worker.celery_app.celery_app worker --loglevel=INFO --queues=document-ingestion --concurrency=2

  frontend:
    build: ./frontend
    ports: ["3000:3000"]
    volumes: ["./frontend:/app", "/app/node_modules"]
    command: npm run dev

volumes:
  postgres_data:
